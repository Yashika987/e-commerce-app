name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - master
      - development
      - 'Feature/**'
  pull_request:
    branches:
      - main
      - master
      - development
      - 'Feature/**'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply Terraform changes?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

      destroy:
        description: 'Destroy infrastructure?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest

    env:
      BRANCH_NAME: ${{ github.ref_name }}
      ENVIRONMENT: ${{ 
        startsWith(github.ref_name, 'feature/') || github.ref_name == 'development' 
        && 'Development' || 
        (github.ref_name == 'main' || github.ref_name == 'master') 
        && 'Production' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsOIDCRole
        aws-region: us-west-2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Terraform Init
      run: |
        echo "Initializing for environment: $ENVIRONMENT"
        terraform init -backend-config="environments/$ENVIRONMENT/backend.tf"

    - name: Terraform Format Check
      run: terraform fmt -check

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -var-file="environments/${{ env.ENVIRONMENT }}/$(echo $ENVIRONMENT | tr '[:upper:]' '[:lower:]').tfvars" -out=tfplan

    - name: Terraform Apply
      if: ${{ github.event.inputs.apply == 'true' && github.event.inputs.destroy != 'true' }}
      run: terraform apply -auto-approve tfplan

    - name: Terraform Destroy
      if: ${{ github.event.inputs.destroy == 'true' }}
      run: terraform destroy -auto-approve -var-file="environments/${{ env.ENVIRONMENT }}/$(echo $ENVIRONMENT | tr '[:upper:]' '[:lower:]').tfvars"